<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .upperportion {
            display: flexbox;
            background-color: blue;
            height: 400px;
            color: white;

        }

        .navbar {
            margin: 8px 0px 0px 0px;
            padding: 20px;
            display: flex;
            background-color: rgba(2, 0, 24, 0.986);
            width: 100%;
            color: white;
            height: 50px;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            text-align: left;
            font-size: 25px;

        }

        .links {
            text-align: center;
            font-size: 22;
        }

        .signup {
            position: relative;
            text-align: right;
            right: 40px;
            font-size: 22px;
        }

        button {
            position: relative;
            text-align: right;
            right: 40px;
            font-size: 15px;
            background-color: yellow;
            font-weight: 600;
            border-radius: 10px;
            height: 50px;
            width: 100px;
            cursor: pointer;
            text-align: center;
        }


        a {
            color: white;
            text-decoration: none;
            font-size: 22;
        }

        .down {
            display: flexbox;
            text-align: center;
            position: relative;
            top: 80px;
            font-size: large;
        }

        .downtext {
            position: relative;
            left: 25px;
            top: 15px;

        }

        #getstarted {
            position: relative;
            top: 30px;
            left: 10px;
        }
        .lowerportion{
            display: flex;
            flex-direction: row;
            height: 200px;
            justify-content: space-evenly;
            /* background-color: greenyellow; */
            align-items: center;
        }
        .l{
            background-color: rgb(220, 223, 255);
            padding: 8px;
            width: 160px;
            height: 80px;
            border-radius: 20px;
            position: relative;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        
    </style>
</head>

<body>
    <div class="upperportion">
        <div class="navbar">
            <div class="logo">CodeLab</div>
            <div class="links">
                <a href="#">Home</a>
                <a href="#">Courses</a>
                <a href="#">Contact</a>
            </div>
            <div class="signup">
                <button>Sign up</button>
            </div>
        </div>
        <div class="down">
            <div class="downtext">
                <h1>Learn Web Development</h1>
                <p>Start from zero. Build real projects</p>
            </div>
                <button id="getstarted">Get Started</button>
        </div>
    </div>
    <div class="lowerportion">
        <div class="l" id="html">
            <h3>HTML</h3>
            <p>Build the structure</p>
        </div>
        <div class="l" id="css">
            <h3>CSS</h3>
            <p>Make it beautiful</p>
        </div>
        <div class="l" id="js">
            <h3>JavaScript</h3>
            <p>Make it smart</p>
        </div>
        <div class="l" id="git">
            <h3>Git</h3>
            <p>Save your work</p>
        </div>
    </div>
</body>

</html>
